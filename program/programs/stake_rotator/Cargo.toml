[package]
name = "stake_rotator"
version = "0.1.0"
description = "Non-custodial LST rotation vault. User retains withdraw rights; bot keypair holds rotation authority."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stake_rotator"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
